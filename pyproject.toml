[project]
name = "django-taggit-labels"
version = "1.0.0"
description = "Alternate labels for django-taggit"
readme = "README.rst"
authors = [
    {name = "Ben Lopatin", email = "ben@wellfire.co"},
]
license = {file = "LICENSE"}
classifiers=[
    'Framework :: Django',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Development Status :: 5 - Production/Stable',
]
requires-python = ">= 3.10"
# dynamic = ["version"]
dependencies = [
    "Django>=5.2",
    'django-taggit>=0.17.0',
]

[dependency-groups]
dev = [
    "pytest",
    "setuptools",
]

[project.urls]
"Source code" = "https://github.com/gradel/django-taggit-labels"
"Issue tracker" = "https://github.com/gradel/django-taggit-labels/issues"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

